quizzes:
  - id: "quiz1"
    title: "Lecture 1 Quiz: Giới thiệu về Khoa học dữ liệu"
    week: 1
    description: "30 câu hỏi trắc nghiệm về khái niệm Khoa học dữ liệu, quy trình phân tích, các lĩnh vực chuyên sâu, loại dữ liệu, và ứng dụng trong kinh tế & kinh doanh."
    link: "quiz/Lec01_quiz/index.html"
    topics:
      - "Khái niệm Khoa học dữ liệu và 3 trụ cột"
      - "Khoa học dữ liệu trong Kinh tế & Kinh doanh"
      - "Các lĩnh vực chuyên sâu (Data Engineering, Analytics, ML)"
      - "Quy trình Khoa học dữ liệu (7 bước)"
      - "Các loại dữ liệu (Structured, Semi-structured, Unstructured)"
      - "Vai trò trong Khoa học dữ liệu (Data Engineer, Analyst, Scientist)"
      - "Học máy (Supervised, Unsupervised, Reinforcement)"
      - "Công cụ và ngôn ngữ lập trình"

  - id: "quiz2"
    title: "Lecture 2 Quiz: Python Basics"
    week: 2
    description: "Test your understanding of Python fundamentals including variables, data types, and control structures."
    link: "quiz/Lec02_quiz/index.html"
    topics:
      - "Variables and data types"
      - "Conditional statements"
      - "Loops and iteration"

  - id: "quiz3"
    title: "Lecture 3 Quiz: NumPy & Pandas"
    week: 4
    description: "30 câu hỏi trắc nghiệm về NumPy và Pandas – mảng, DataFrame, và thao tác dữ liệu."
    link: "quiz/Lec03_quiz/index.html"
    topics:
      - "NumPy arrays và dtype"
      - "Slicing, indexing, boolean indexing"
      - "Pandas DataFrame và Series"
      - "Đọc dữ liệu và thao tác cơ bản"

  - id: "quiz4"
    title: "Lecture 4 Quiz: Nhập và Lưu Trữ Dữ Liệu"
    week: 6
    description: "30 câu hỏi trắc nghiệm về CSV, JSON, Web HTML, RSS/XML, Excel, API và SQL Database."
    link: "quiz/Lec04_quiz/index.html"
    topics:
      - "Đọc/ghi CSV, JSON"
      - "Thu thập dữ liệu web (HTML, RSS/XML)"
      - "Đọc Excel"
      - "Web APIs và cơ sở dữ liệu"

  # Quizzes 5–7 were built and deployed but never listed here, so nothing on the
  # site linked them. They have been reachable at their URLs the whole time.
  - id: "quiz5"
    title: "Lecture 5 Quiz: Làm sạch và chuẩn bị dữ liệu"
    week: 8
    description: "Bài tập trắc nghiệm về làm sạch dữ liệu, xử lý giá trị thiếu và chuẩn bị dữ liệu cho phân tích."
    link: "quiz/Lec05_quiz/index.html"
    topics:
      - "Xử lý giá trị thiếu"
      - "Loại bỏ dữ liệu trùng lặp"
      - "Chuyển đổi kiểu dữ liệu"
      - "Chuẩn hoá và làm sạch dữ liệu"

  - id: "quiz6"
    title: "Lecture 6 Quiz: Sắp xếp và biến đổi dữ liệu"
    week: 10
    description: "30 câu hỏi trắc nghiệm tự động chấm điểm về sắp xếp, nhóm, tổng hợp và biến đổi dữ liệu."
    link: "quiz/Lec06_quiz/index.html"
    topics:
      - "Sắp xếp và lọc dữ liệu"
      - "Group by và tổng hợp"
      - "Pivot và reshape"
      - "Kết hợp nhiều bảng dữ liệu"

  - id: "quiz7"
    title: "Lecture 7 Quiz: Data Visualization"
    week: 12
    description: "30 câu hỏi trắc nghiệm tự động chấm điểm về trực quan hoá dữ liệu với Matplotlib và Seaborn."
    link: "quiz/Lec07_quiz/index.html"
    topics:
      - "Biểu đồ cơ bản: histogram, scatter, bar, boxplot"
      - "Chọn loại biểu đồ phù hợp"
      - "Matplotlib và Seaborn"
      - "Diễn giải thông tin từ biểu đồ"
